<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tikpal Explore</title>
    <style>
      :root {
        color-scheme: dark;
        background: #02040a;
        color: #f7fbff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
        -webkit-user-drag: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        user-select: none;
        -webkit-touch-callout: none;
      }

      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 48% 46%, rgba(62, 181, 255, 0.18), transparent 28%),
          linear-gradient(135deg, #02040a 0%, #070c18 58%, #02040a 100%);
        animation: tikpalExploreFade 900ms ease-in-out both;
      }

      .mark {
        width: 96px;
        height: 96px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        background:
          radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.16) 38%, transparent 62%),
          rgba(255, 255, 255, 0.04);
        box-shadow: 0 0 70px rgba(62, 181, 255, 0.24);
        animation: tikpalExplorePulse 820ms ease-in-out infinite alternate;
      }

      @keyframes tikpalExploreFade {
        from { opacity: 0.18; }
        42% { opacity: 1; }
        to { opacity: 0.92; }
      }

      @keyframes tikpalExplorePulse {
        from { transform: scale(0.94); opacity: 0.52; }
        to { transform: scale(1.04); opacity: 0.86; }
      }

      @media (prefers-reduced-motion: reduce) {
        body,
        .mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="mark" aria-label="Opening Explore"></div>
    <script>
      (() => {
        const block = (event) => event.preventDefault();
        document.addEventListener("contextmenu", block, true);
        document.addEventListener("dragstart", block, true);
        document.addEventListener("selectstart", block, true);
      })();
    </script>
  </body>
</html>
