<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tikpal Explore</title>
    <style>
      :root {
        color-scheme: dark;
        background: #05070b;
        color: #f7fbff;
        font-family: var(--app-font-family);
        font-synthesis: none;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
        --app-font-family:
          Inter,
          "SF Pro Display",
          "SF Pro Text",
          "Helvetica Neue",
          "Noto Sans CJK SC",
          "Noto Sans CJK JP",
          "Noto Sans CJK KR",
          "Source Han Sans CN",
          "PingFang SC",
          "WenQuanYi Zen Hei",
          sans-serif;
        --provider-tone: #81d7ff;
        --provider-text-scale: 1.1;
      }

      :root[data-font-theme="serif"] {
        --app-font-family:
          "Noto Serif CJK SC",
          "Noto Serif CJK JP",
          "Noto Serif CJK KR",
          "Iowan Old Style",
          "Palatino Linotype",
          "Book Antiqua",
          Georgia,
          "Times New Roman",
          "Songti SC",
          serif;
      }

      :root[data-font-theme="hardware"] {
        --app-font-family:
          "Noto Sans CJK SC",
          "Noto Sans CJK JP",
          "Noto Sans CJK KR",
          "Source Han Sans CN",
          "WenQuanYi Zen Hei",
          Inter,
          sans-serif;
      }

      :root[data-font-theme="precision"] {
        --app-font-family:
          "Source Han Sans CN",
          "Noto Sans CJK SC",
          "Noto Sans CJK JP",
          "Noto Sans CJK KR",
          "PingFang SC",
          Inter,
          sans-serif;
      }

      :root[data-font-theme="sans"] {
        --app-font-family:
          Inter,
          Roboto,
          "Fira Sans",
          "SF Pro Display",
          "Helvetica Neue",
          "Noto Sans CJK SC",
          "Noto Sans CJK JP",
          "Noto Sans CJK KR",
          "Source Han Sans CN",
          sans-serif;
      }

      :root[data-font-theme="mono"] {
        --app-font-family:
          "Noto Sans Mono CJK SC",
          "Noto Sans Mono CJK JP",
          "Noto Sans Mono CJK KR",
          "SF Mono",
          "IBM Plex Mono",
          "JetBrains Mono",
          monospace;
      }

      * {
        box-sizing: border-box;
        -webkit-user-drag: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        user-select: none;
        -webkit-touch-callout: none;
      }

      body {
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(4, 6, 11, 1), rgba(11, 15, 20, 1)),
          #05070b;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.032), transparent 28%, transparent 72%, rgba(255, 255, 255, 0.022));
        opacity: 0.52;
      }

      .logo-floor {
        display: none;
      }

      .signal-stage {
        position: relative;
        z-index: 1;
        width: min(520px, calc(100vw - 96px));
        display: grid;
        justify-items: center;
        gap: 14px;
        transform: translateY(-4px);
        animation: tikpalSignalStageIn 260ms ease-out both;
      }

      .provider-name {
        max-width: 100%;
        margin: 0;
        color: #f7fbff;
        font-size: calc(30px * var(--provider-text-scale));
        font-weight: 760;
        line-height: 1.1;
        text-align: center;
        overflow-wrap: anywhere;
      }

      .connecting-label {
        margin: 0;
        color: color-mix(in srgb, var(--provider-tone) 72%, #ffffff);
        font-size: calc(12px * var(--provider-text-scale));
        font-weight: 760;
        line-height: 1;
      }

      @keyframes tikpalSignalStageIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(-4px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .signal-stage {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="logo-floor" aria-hidden="true"></div>
    <main class="signal-stage" role="status" aria-live="polite">
      <h1 class="provider-name">Explore</h1>
      <p class="connecting-label">Connecting</p>
    </main>
    <script>
      (() => {
        const providers = {
          suno: { label: "Suno", tone: "#ff7a59" },
          spotify: { label: "Spotify", tone: "#1ed760" },
          youtube_music: { label: "YouTube Music", tone: "#ff0033" },
          apple_music: { label: "Apple Music", tone: "#f5f5f7" },
          tidal: { label: "TIDAL", tone: "#ffffff" },
          qobuz: { label: "Qobuz", tone: "#c7a45d" },
          deezer: { label: "Deezer", tone: "#b77cff" },
          amazon_music: { label: "Amazon Music", tone: "#46c4ff" },
          qq_music: { label: "QQ Music", tone: "#20d070" },
          netease_music: { label: "NetEase Cloud Music", tone: "#e64040" }
        };
        const translations = {
          en: { connecting: "Connecting", connectingTo: "Connecting to {label}" },
          "zh-CN": { connecting: "连接中", connectingTo: "正在连接 {label}" },
          de: { connecting: "Verbinden", connectingTo: "Verbindet mit {label}" },
          it: { connecting: "Connessione", connectingTo: "Connessione a {label}" },
          ko: { connecting: "연결 중", connectingTo: "{label} 연결 중" },
          ja: { connecting: "接続中", connectingTo: "{label}に接続中" },
          es: { connecting: "Conectando", connectingTo: "Conectando con {label}" }
        };
        const normalizeLocale = (value) => Object.prototype.hasOwnProperty.call(translations, value) ? value : "en";
        const normalizeFontTheme = (value) => ["system", "hardware", "precision", "sans", "serif", "mono"].includes(value) ? value : "system";
        const normalizeTextScale = (value) => [1, 1.1, 1.2].includes(Number(value)) ? Number(value) : 1.1;
        const template = (value, params) => value.replace(/\{([^}]+)\}/g, (_, key) => params[key] ?? "");
        const providerId = new URLSearchParams(window.location.search).get("provider") || "";
        const fallbackProvider = providers[providerId] || { label: "Explore", tone: "#81d7ff" };
        const providerName = document.querySelector(".provider-name");
        const connectingLabel = document.querySelector(".connecting-label");
        const signalStage = document.querySelector(".signal-stage");

        const applyState = (webModeState) => {
          const preferences = webModeState?.preferences || {};
          const settings = webModeState?.settings || {};
          const locale = normalizeLocale(preferences.locale);
          const fontTheme = normalizeFontTheme(preferences.fontTheme);
          const runtimeProvider = Array.isArray(webModeState?.providers)
            ? webModeState.providers.find((candidate) => candidate.id === providerId)
            : null;
          const provider = {
            ...fallbackProvider,
            ...(runtimeProvider?.label ? { label: runtimeProvider.label } : {})
          };
          const text = translations[locale] || translations.en;
          document.documentElement.lang = locale;
          document.documentElement.dataset.fontTheme = fontTheme;
          document.documentElement.style.setProperty("--provider-tone", provider.tone);
          document.documentElement.style.setProperty("--provider-text-scale", String(normalizeTextScale(settings.providerTextScale)));
          document.body.dataset.provider = providerId || "explore";
          providerName.textContent = provider.label;
          connectingLabel.textContent = text.connecting;
          signalStage.setAttribute("aria-label", template(text.connectingTo, { label: provider.label }));
        };

        applyState(null);
        fetch("/api/v1/web-mode/state", { headers: { Accept: "application/json" } })
          .then((response) => response.ok ? response.json() : null)
          .then(applyState)
          .catch(() => {});

        const block = (event) => event.preventDefault();
        document.addEventListener("contextmenu", block, true);
        document.addEventListener("dragstart", block, true);
        document.addEventListener("selectstart", block, true);
      })();
    </script>
  </body>
</html>
