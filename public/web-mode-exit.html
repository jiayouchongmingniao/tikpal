<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tikpal Room Return</title>
    <style>
      :root {
        color-scheme: dark;
        background: #05070b;
        color: #f7fbff;
        font-family: var(--app-font-family);
        font-synthesis: none;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
        --app-font-family:
          Inter,
          "SF Pro Display",
          "SF Pro Text",
          "Helvetica Neue",
          "Noto Sans CJK SC",
          "Noto Sans CJK JP",
          "Noto Sans CJK KR",
          "Source Han Sans CN",
          "PingFang SC",
          "WenQuanYi Zen Hei",
          sans-serif;
        --room-tone: #76d7ff;
        --room-base: #06101b;
      }

      :root[data-font-theme="serif"] {
        --app-font-family:
          "Noto Serif CJK SC",
          "Noto Serif CJK JP",
          "Noto Serif CJK KR",
          "Iowan Old Style",
          "Palatino Linotype",
          "Book Antiqua",
          Georgia,
          "Times New Roman",
          "Songti SC",
          serif;
      }

      :root[data-font-theme="hardware"] {
        --app-font-family:
          "Noto Sans CJK SC",
          "Noto Sans CJK JP",
          "Noto Sans CJK KR",
          "Source Han Sans CN",
          "WenQuanYi Zen Hei",
          Inter,
          sans-serif;
      }

      :root[data-font-theme="precision"] {
        --app-font-family:
          "Source Han Sans CN",
          "Noto Sans CJK SC",
          "Noto Sans CJK JP",
          "Noto Sans CJK KR",
          "PingFang SC",
          Inter,
          sans-serif;
      }

      :root[data-font-theme="sans"] {
        --app-font-family:
          Inter,
          Roboto,
          "Fira Sans",
          "SF Pro Display",
          "Helvetica Neue",
          "Noto Sans CJK SC",
          "Noto Sans CJK JP",
          "Noto Sans CJK KR",
          "Source Han Sans CN",
          sans-serif;
      }

      :root[data-font-theme="mono"] {
        --app-font-family:
          "Noto Sans Mono CJK SC",
          "Noto Sans Mono CJK JP",
          "Noto Sans Mono CJK KR",
          "SF Mono",
          "IBM Plex Mono",
          "JetBrains Mono",
          monospace;
      }

      * {
        box-sizing: border-box;
        -webkit-user-drag: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        user-select: none;
        -webkit-touch-callout: none;
      }

      body {
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(4, 6, 11, 1), var(--room-base)),
          #05070b;
        transition:
          opacity 240ms ease,
          filter 240ms ease;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.032), transparent 28%, transparent 72%, rgba(255, 255, 255, 0.022));
        opacity: 0.52;
      }

      .logo-floor {
        display: none;
      }

      .return-stage {
        position: relative;
        z-index: 1;
        width: min(520px, calc(100vw - 180px));
        display: grid;
        justify-items: center;
        gap: 18px;
        transform: translateY(-3px);
      }

      .return-stage img {
        width: min(300px, 22vw);
        height: auto;
        opacity: 0.82;
        filter: drop-shadow(0 24px 62px rgba(0, 0, 0, 0.38));
      }

      body[data-room="focus"] {
        --room-tone: #76d7ff;
        --room-base: #061322;
      }

      body[data-room="calm"] {
        --room-tone: #7ee4b8;
        --room-base: #071912;
      }

      body[data-room="sleep"] {
        --room-tone: #a9a4ff;
        --room-base: #08091c;
      }

      body[data-room="hifi"] {
        --room-tone: #e0b25f;
        --room-base: #0f0c08;
      }

      body.is-revealing {
        opacity: 0;
        filter: blur(5px);
      }

    </style>
  </head>
  <body aria-label="Closing Explore">
    <div class="logo-floor" aria-hidden="true"></div>
    <main class="return-stage" aria-hidden="true">
      <img src="/assets/tikpal-scene-logo.png" alt="" />
    </main>
    <script>
      (() => {
        const translations = {
          en: { closing: "Closing" },
          "zh-CN": { closing: "关闭中" },
          de: { closing: "Schließt" },
          it: { closing: "Chiusura" },
          ko: { closing: "닫는 중" },
          ja: { closing: "終了中" },
          es: { closing: "Cerrando" }
        };
        const normalizeLocale = (value) => Object.prototype.hasOwnProperty.call(translations, value) ? value : "en";
        const normalizeFontTheme = (value) => ["system", "hardware", "precision", "sans", "serif", "mono"].includes(value) ? value : "system";
        const room = new URLSearchParams(window.location.search).get("room") || "calm";
        document.body.dataset.room = ["focus", "calm", "sleep", "hifi"].includes(room) ? room : "calm";
        fetch("/api/v1/web-mode/state", { headers: { Accept: "application/json" } })
          .then((response) => response.ok ? response.json() : null)
          .then((state) => {
            const locale = normalizeLocale(state?.preferences?.locale);
            const fontTheme = normalizeFontTheme(state?.preferences?.fontTheme);
            document.documentElement.lang = locale;
            document.documentElement.dataset.fontTheme = fontTheme;
            document.body.setAttribute("aria-label", translations[locale].closing);
          })
          .catch(() => {});
        const reveal = () => document.body.classList.add("is-revealing");
        window.addEventListener("keydown", (event) => {
          if (event.key === "F8" || event.code === "F8") {
            reveal();
          }
        });
        window.addEventListener("message", (event) => {
          if (event.data === "tikpal:room-return-reveal") {
            reveal();
          }
        });
        const block = (event) => event.preventDefault();
        document.addEventListener("contextmenu", block, true);
        document.addEventListener("dragstart", block, true);
        document.addEventListener("selectstart", block, true);
      })();
    </script>
  </body>
</html>
