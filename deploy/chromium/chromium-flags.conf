# Tikpal kiosk Chromium flags.
# Blank lines and comments are ignored by launch-tikpal-kiosk.sh.
--no-first-run
--no-default-browser-check
--disable-session-crashed-bubble
--disable-infobars
--disable-features=Translate,InterestFeedContentSuggestions,MediaRouter,OptimizationHints,StatusBubble
--autoplay-policy=no-user-gesture-required
--overscroll-history-navigation=0
--disable-pinch
--hide-scrollbars
--disable-gpu-memory-buffer-compositor-resources
--password-store=basic
--use-mock-keychain
