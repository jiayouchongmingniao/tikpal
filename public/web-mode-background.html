<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tikpal Explore Background</title>
    <style>
      :root {
        color-scheme: dark;
        background: #05070b;
        color: #f7fbff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --provider-tone: #81d7ff;
      }

      * {
        box-sizing: border-box;
        -webkit-user-drag: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        user-select: none;
        -webkit-touch-callout: none;
      }

      body {
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(3, 5, 11, 0.98), rgba(9, 14, 26, 0.98)),
          #05070b;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 18% 28%, color-mix(in srgb, var(--provider-tone) 18%, transparent), transparent 34%),
          radial-gradient(circle at 78% 70%, rgba(116, 255, 214, 0.08), transparent 32%),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025), transparent 18%, transparent 82%, rgba(255, 255, 255, 0.022));
      }

      .brand {
        width: min(520px, calc(100vw - 120px));
        display: grid;
        justify-items: center;
        gap: 22px;
        opacity: 0.72;
      }

      .brand img {
        width: min(320px, 42vw);
        height: auto;
        opacity: 0.88;
        filter: drop-shadow(0 24px 62px rgba(0, 0, 0, 0.38));
      }

      .brand p {
        margin: 0;
        color: rgba(227, 241, 255, 0.62);
        font-size: 16px;
        font-weight: 760;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="brand" aria-label="Tikpal Explore">
      <img src="/assets/tikpal-scene-logo.png" alt="Tikpal" />
      <p>Explore</p>
    </main>
    <script>
      (() => {
        const providers = {
          suno: "#ff7a59",
          spotify: "#1ed760",
          youtube_music: "#ff0033",
          apple_music: "#f5f5f7",
          tidal: "#ffffff",
          qobuz: "#c7a45d",
          deezer: "#b77cff",
          amazon_music: "#46c4ff",
          qq_music: "#20d070",
          netease_music: "#e64040"
        };
        const providerId = new URLSearchParams(window.location.search).get("provider") || "";
        document.body.dataset.provider = providerId || "explore";
        document.documentElement.style.setProperty("--provider-tone", providers[providerId] || "#81d7ff");
        const block = (event) => event.preventDefault();
        document.addEventListener("contextmenu", block, true);
        document.addEventListener("dragstart", block, true);
        document.addEventListener("selectstart", block, true);
      })();
    </script>
  </body>
</html>
