<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tikpal Explore</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #080b0e;
        opacity: 0;
        transition: opacity 3000ms ease-out;
      }

      html.fade-in,
      body.fade-in {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <script>
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.documentElement.classList.add('fade-in');
        });
      });
    </script>
  </body>
</html>
