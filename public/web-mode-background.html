<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tikpal Explore Background</title>
    <style>
      :root {
        color-scheme: dark;
        background: #05070b;
        color: #f7fbff;
        font-family: var(--app-font-family);
        font-synthesis: none;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
        --app-font-family:
          Inter,
          "SF Pro Display",
          "SF Pro Text",
          "Helvetica Neue",
          "Noto Sans CJK SC",
          "Noto Sans CJK JP",
          "Noto Sans CJK KR",
          "Source Han Sans CN",
          "PingFang SC",
          "WenQuanYi Zen Hei",
          sans-serif;
        --provider-tone: #81d7ff;
      }

      :root[data-font-theme="serif"] {
        --app-font-family:
          "Noto Serif CJK SC",
          "Noto Serif CJK JP",
          "Noto Serif CJK KR",
          "Iowan Old Style",
          "Palatino Linotype",
          "Book Antiqua",
          Georgia,
          "Times New Roman",
          "Songti SC",
          serif;
      }

      :root[data-font-theme="hardware"] {
        --app-font-family:
          "Noto Sans CJK SC",
          "Noto Sans CJK JP",
          "Noto Sans CJK KR",
          "Source Han Sans CN",
          "WenQuanYi Zen Hei",
          Inter,
          sans-serif;
      }

      :root[data-font-theme="precision"] {
        --app-font-family:
          "Source Han Sans CN",
          "Noto Sans CJK SC",
          "Noto Sans CJK JP",
          "Noto Sans CJK KR",
          "PingFang SC",
          Inter,
          sans-serif;
      }

      :root[data-font-theme="sans"] {
        --app-font-family:
          Inter,
          Roboto,
          "Fira Sans",
          "SF Pro Display",
          "Helvetica Neue",
          "Noto Sans CJK SC",
          "Noto Sans CJK JP",
          "Noto Sans CJK KR",
          "Source Han Sans CN",
          sans-serif;
      }

      :root[data-font-theme="mono"] {
        --app-font-family:
          "Noto Sans Mono CJK SC",
          "Noto Sans Mono CJK JP",
          "Noto Sans Mono CJK KR",
          "SF Mono",
          "IBM Plex Mono",
          "JetBrains Mono",
          monospace;
      }

      * {
        box-sizing: border-box;
        -webkit-user-drag: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        user-select: none;
        -webkit-touch-callout: none;
      }

      body {
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(4, 6, 11, 1), rgba(11, 15, 20, 1)),
          #05070b;
        transition:
          background 260ms ease,
          opacity 260ms ease,
          filter 260ms ease;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.032), transparent 28%, transparent 72%, rgba(255, 255, 255, 0.022));
        opacity: 0.52;
      }

      .logo-floor {
        display: none;
      }

      .brand {
        position: relative;
        z-index: 1;
        width: min(440px, calc(100vw - 120px));
        display: grid;
        justify-items: center;
        gap: 18px;
        opacity: 0.84;
        transform: scale(1);
        transition:
          opacity 260ms ease,
          transform 300ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .brand img {
        width: min(280px, 34vw);
        height: auto;
        opacity: 0.84;
        filter: drop-shadow(0 24px 62px rgba(0, 0, 0, 0.38));
      }

      .brand p {
        margin: 0;
        color: rgba(227, 241, 255, 0.62);
        font-size: 13px;
        font-weight: 800;
      }

      body.is-revealing {
        opacity: 0;
        filter: blur(5px);
      }

      body.is-revealing .brand {
        opacity: 0;
        transform: scale(0.975);
      }
    </style>
  </head>
  <body>
    <div class="logo-floor" aria-hidden="true"></div>
    <main class="brand" aria-label="Tikpal Explore">
      <img src="/assets/tikpal-scene-logo.png" alt="Tikpal" />
      <p>Explore</p>
    </main>
    <script>
      (() => {
        const providers = {
          suno: "#ff7a59",
          spotify: "#1ed760",
          youtube_music: "#ff0033",
          apple_music: "#f5f5f7",
          tidal: "#ffffff",
          qobuz: "#c7a45d",
          deezer: "#b77cff",
          amazon_music: "#46c4ff",
          qq_music: "#20d070",
          netease_music: "#e64040"
        };
        const normalizeFontTheme = (value) => ["system", "hardware", "precision", "sans", "serif", "mono"].includes(value) ? value : "system";
        const providerId = new URLSearchParams(window.location.search).get("provider") || "";
        document.body.dataset.provider = providerId || "explore";
        document.documentElement.style.setProperty("--provider-tone", providers[providerId] || "#81d7ff");
        fetch("/api/v1/web-mode/state", { headers: { Accept: "application/json" } })
          .then((response) => response.ok ? response.json() : null)
          .then((state) => {
            const locale = state?.preferences?.locale;
            const fontTheme = normalizeFontTheme(state?.preferences?.fontTheme);
            if (typeof locale === "string" && locale) document.documentElement.lang = locale;
            document.documentElement.dataset.fontTheme = fontTheme;
          })
          .catch(() => {});
        const reveal = () => document.body.classList.add("is-revealing");
        window.addEventListener("keydown", (event) => {
          if (event.key === "F8" || event.code === "F8") {
            reveal();
          }
        });
        window.addEventListener("message", (event) => {
          if (event.data === "tikpal:entry-reveal") {
            reveal();
          }
        });
        const block = (event) => event.preventDefault();
        document.addEventListener("contextmenu", block, true);
        document.addEventListener("dragstart", block, true);
        document.addEventListener("selectstart", block, true);
      })();
    </script>
  </body>
</html>
