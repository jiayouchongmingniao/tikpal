<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tikpal Room Return</title>
    <style>
      :root {
        color-scheme: dark;
        background: #06080d;
        color: #f7fbff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --room-tone: #76d7ff;
        --room-glow: rgba(118, 215, 255, 0.18);
        --room-base: #06101b;
      }

      * {
        box-sizing: border-box;
        -webkit-user-drag: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        user-select: none;
        -webkit-touch-callout: none;
      }

      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 24% 28%, var(--room-glow), transparent 34%),
          radial-gradient(circle at 82% 76%, rgba(255, 255, 255, 0.045), transparent 38%),
          linear-gradient(135deg, rgba(4, 6, 12, 0.98), var(--room-base)),
          #05070b;
        transition:
          opacity 260ms ease,
          filter 260ms ease;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.035), transparent 18%, transparent 82%, rgba(255, 255, 255, 0.028)),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.012) 0 1px, transparent 1px 84px);
        opacity: 0.54;
      }

      body::after {
        content: "";
        width: min(420px, 28vw);
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--room-tone) 62%, white), transparent);
        opacity: 0.58;
        transform: translateY(0);
        animation: tikpalRoomReturn 800ms ease-in-out infinite alternate;
      }

      body[data-room="focus"] {
        --room-tone: #76d7ff;
        --room-glow: rgba(65, 188, 255, 0.19);
        --room-base: #061322;
      }

      body[data-room="calm"] {
        --room-tone: #7ee4b8;
        --room-glow: rgba(92, 225, 170, 0.16);
        --room-base: #071912;
      }

      body[data-room="sleep"] {
        --room-tone: #a9a4ff;
        --room-glow: rgba(128, 118, 255, 0.15);
        --room-base: #08091c;
      }

      body[data-room="hifi"] {
        --room-tone: #e0b25f;
        --room-glow: rgba(224, 178, 95, 0.14);
        --room-base: #0f0c08;
      }

      body.is-revealing {
        opacity: 0;
        filter: blur(6px);
      }

      @keyframes tikpalRoomReturn {
        from {
          opacity: 0.34;
          transform: scaleX(0.48);
        }
        to {
          opacity: 0.72;
          transform: scaleX(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body aria-label="Returning to room">
    <script>
      (() => {
        const room = new URLSearchParams(window.location.search).get("room") || "calm";
        document.body.dataset.room = ["focus", "calm", "sleep", "hifi"].includes(room) ? room : "calm";
        const reveal = () => document.body.classList.add("is-revealing");
        window.addEventListener("keydown", (event) => {
          if (event.key === "F8" || event.code === "F8") {
            reveal();
          }
        });
        window.addEventListener("message", (event) => {
          if (event.data === "tikpal:room-return-reveal") {
            reveal();
          }
        });
        const block = (event) => event.preventDefault();
        document.addEventListener("contextmenu", block, true);
        document.addEventListener("dragstart", block, true);
        document.addEventListener("selectstart", block, true);
      })();
    </script>
  </body>
</html>
