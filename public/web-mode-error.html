<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tikpal Explore</title>
    <style>
      :root {
        color-scheme: dark;
        background: #05070c;
        color: #f7fbff;
        --app-font-family:
          Inter,
          "SF Pro Display",
          "SF Pro Text",
          "Helvetica Neue",
          "Noto Sans CJK SC",
          "Noto Sans CJK JP",
          "Noto Sans CJK KR",
          "Source Han Sans CN",
          "PingFang SC",
          "WenQuanYi Zen Hei",
          "Segoe UI",
          sans-serif;
        font-family: var(--app-font-family);
      }

      :root[data-font-theme="serif"] {
        --app-font-family:
          "Noto Serif CJK SC",
          "Noto Serif CJK JP",
          "Noto Serif CJK KR",
          "Iowan Old Style",
          "Palatino Linotype",
          "Book Antiqua",
          Georgia,
          "Times New Roman",
          "Songti SC",
          serif;
      }

      :root[data-font-theme="hardware"] {
        --app-font-family:
          "Noto Sans CJK SC",
          "Noto Sans CJK JP",
          "Noto Sans CJK KR",
          "Source Han Sans CN",
          "WenQuanYi Zen Hei",
          Inter,
          sans-serif;
      }

      :root[data-font-theme="precision"] {
        --app-font-family:
          "Source Han Sans CN",
          "Noto Sans CJK SC",
          "Noto Sans CJK JP",
          "Noto Sans CJK KR",
          "PingFang SC",
          Inter,
          sans-serif;
      }

      :root[data-font-theme="sans"] {
        --app-font-family:
          Inter,
          Roboto,
          "Fira Sans",
          "SF Pro Display",
          "Helvetica Neue",
          "Noto Sans CJK SC",
          "Noto Sans CJK JP",
          "Noto Sans CJK KR",
          "Source Han Sans CN",
          sans-serif;
      }

      :root[data-font-theme="mono"] {
        --app-font-family:
          "Noto Sans Mono CJK SC",
          "Noto Sans Mono CJK JP",
          "Noto Sans Mono CJK KR",
          "SF Mono",
          "IBM Plex Mono",
          "JetBrains Mono",
          "Cascadia Mono",
          monospace;
      }

      * {
        box-sizing: border-box;
        -webkit-user-drag: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        -webkit-touch-callout: none;
      }

      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 22% 28%, rgba(42, 145, 255, 0.24), transparent 34%),
          radial-gradient(circle at 72% 70%, rgba(77, 255, 205, 0.13), transparent 32%),
          linear-gradient(135deg, #05070c 0%, #101733 55%, #070910 100%);
        user-select: none;
      }

      .shell {
        width: min(960px, 72vw);
        padding: 54px 62px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        background: rgba(5, 8, 16, 0.72);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.34);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: rgba(174, 218, 255, 0.76);
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 780px;
        color: #ffffff;
        font-size: 58px;
        line-height: 1.02;
        letter-spacing: 0;
      }

      p {
        max-width: 720px;
        margin: 24px 0 0;
        color: rgba(232, 242, 255, 0.76);
        font-size: 24px;
        line-height: 1.45;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(250, 253, 255, 0.9);
        font-size: 18px;
        font-weight: 800;
      }

      @media (max-width: 900px) {
        .shell {
          width: min(560px, calc(100vw - 44px));
          padding: 36px;
          border-radius: 22px;
        }

        h1 {
          font-size: 38px;
        }

        p {
          font-size: 19px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell" aria-live="polite">
      <p class="eyebrow">Explore</p>
      <h1><span id="provider-label">This music service</span> <span id="headline-tail">did not respond</span></h1>
      <p>
        <span id="body-copy">The official web player could not be reached from this device. Change Proxy in Settings, choose another provider, or try again later.</span>
      </p>
      <div class="chips" id="connection-details" aria-label="Connection details">
        <span class="chip" id="proxy-chip">Direct</span>
        <span class="chip" id="reason-chip">load_failed</span>
      </div>
    </main>
    <script>
      (() => {
        const copy = {
          en: {
            title: "Tikpal Explore",
            provider: "This music service",
            tail: "did not respond",
            body: "The official web player could not be reached from this device. Change Proxy in Settings, choose another provider, or try again later.",
            regionTail: "is unavailable in this region",
            regionBody: "The current Proxy exit is in a region where the official web player is unavailable. In Settings, choose a Proxy exit that supports this service, then try again.",
            regionReason: "Unavailable in this region",
            proxyOn: "Proxy On",
            direct: "Direct",
            needsProxy: "Turn Proxy On in Settings",
            proxyFailed: "Proxy did not connect",
            tryAgain: "Try again",
            details: "Connection details"
          },
          "zh-CN": {
            title: "Tikpal Explore",
            provider: "这个音乐服务",
            tail: "暂时没有响应",
            body: "此设备暂时无法打开官方网页播放器。请到 Settings 修改 Proxy、选择其他服务，或稍后重试。",
            regionTail: "在当前地区不可用",
            regionBody: "当前 Proxy 出口所在地区无法使用官方网页播放器。请在 Settings 更换支持此服务的 Proxy 出口后重试，或选择其他服务。",
            regionReason: "当前地区不可用",
            proxyOn: "代理已开",
            direct: "直连",
            needsProxy: "请在 Settings 打开 Proxy",
            proxyFailed: "Proxy 未连通",
            tryAgain: "稍后重试",
            details: "连接状态"
          },
          de: {
            title: "Tikpal Explore",
            provider: "Dieser Musikdienst",
            tail: "antwortet nicht",
            body: "Der offizielle Webplayer ist auf diesem Gerät nicht erreichbar. Ändere Proxy in Settings, wähle einen anderen Dienst oder versuche es später erneut.",
            regionTail: "ist in dieser Region nicht verfügbar",
            regionBody: "Der aktuelle Proxy-Ausgang befindet sich in einer Region, in der der offizielle Webplayer nicht verfügbar ist. Wähle in Settings einen unterstützten Proxy-Ausgang und versuche es erneut.",
            regionReason: "In dieser Region nicht verfügbar",
            proxyOn: "Proxy Ein",
            direct: "Direkt",
            needsProxy: "Proxy in Settings einschalten",
            proxyFailed: "Proxy nicht verbunden",
            tryAgain: "Erneut versuchen",
            details: "Verbindungsdetails"
          },
          it: {
            title: "Tikpal Explore",
            provider: "Questo servizio musicale",
            tail: "non risponde",
            body: "Il player web ufficiale non è raggiungibile da questo dispositivo. Cambia Proxy in Settings, scegli un altro servizio o riprova più tardi.",
            regionTail: "non è disponibile in questa regione",
            regionBody: "L'uscita Proxy corrente si trova in una regione in cui il player web ufficiale non è disponibile. In Settings, scegli un'uscita Proxy supportata e riprova.",
            regionReason: "Non disponibile in questa regione",
            proxyOn: "Proxy On",
            direct: "Diretto",
            needsProxy: "Attiva Proxy in Settings",
            proxyFailed: "Proxy non connesso",
            tryAgain: "Riprova",
            details: "Dettagli connessione"
          },
          ko: {
            title: "Tikpal Explore",
            provider: "이 음악 서비스",
            tail: "응답하지 않음",
            body: "이 기기에서 공식 웹 플레이어에 연결할 수 없습니다. Settings에서 Proxy를 바꾸거나 다른 서비스를 선택한 뒤 다시 시도하세요.",
            regionTail: "은 현재 지역에서 사용할 수 없음",
            regionBody: "현재 Proxy 출구 지역에서는 공식 웹 플레이어를 사용할 수 없습니다. Settings에서 이 서비스를 지원하는 Proxy 출구로 바꾼 뒤 다시 시도하세요.",
            regionReason: "현재 지역에서 사용할 수 없음",
            proxyOn: "프록시 켜짐",
            direct: "직접",
            needsProxy: "Settings에서 Proxy 켜기",
            proxyFailed: "Proxy 연결 안 됨",
            tryAgain: "다시 시도",
            details: "연결 정보"
          },
          ja: {
            title: "Tikpal Explore",
            provider: "この音楽サービス",
            tail: "が応答しません",
            body: "このデバイスから公式 Web プレイヤーに接続できません。Settings で Proxy を変更するか、別のサービスを選んでください。",
            regionTail: "はこの地域では利用できません",
            regionBody: "現在の Proxy 出口の地域では公式 Web プレイヤーを利用できません。Settings でこのサービスに対応した Proxy 出口に変更してから、もう一度お試しください。",
            regionReason: "この地域では利用できません",
            proxyOn: "プロキシ オン",
            direct: "直接",
            needsProxy: "Settings で Proxy をオン",
            proxyFailed: "Proxy 未接続",
            tryAgain: "再試行",
            details: "接続情報"
          },
          es: {
            title: "Tikpal Explore",
            provider: "Este servicio de música",
            tail: "no responde",
            body: "No se pudo abrir el reproductor web oficial desde este dispositivo. Cambia Proxy en Settings, elige otro servicio o inténtalo más tarde.",
            regionTail: "no está disponible en esta región",
            regionBody: "La salida Proxy actual está en una región donde el reproductor web oficial no está disponible. En Settings, elige una salida Proxy compatible con este servicio y vuelve a intentarlo.",
            regionReason: "No disponible en esta región",
            proxyOn: "Proxy On",
            direct: "Directo",
            needsProxy: "Activa Proxy en Settings",
            proxyFailed: "Proxy no conectó",
            tryAgain: "Inténtalo de nuevo",
            details: "Detalles de conexión"
          }
        };
        const params = new URLSearchParams(location.search);
        const normalizeLocale = (value) => Object.prototype.hasOwnProperty.call(copy, value || "") ? value : "en";
        const normalizeFontTheme = (value) => ["system", "hardware", "precision", "sans", "serif", "mono"].includes(value) ? value : "system";
        const friendlyReason = (dict) => {
          const value = String(params.get("reason") || "load_failed").trim();
          const normalized = value.toLowerCase();
          const proxyActive = params.get("proxy") === "proxy";
          if (/\bneeds proxy(?: on)?\b/.test(normalized)) return dict.needsProxy;
          if (normalized.includes("proxy did not connect")) return dict.proxyFailed;
          if (normalized === "region_unavailable") return dict.regionReason;
          if (normalized === "proxy_unreachable") return dict.proxyFailed;
          if (normalized === "connection_timeout") return proxyActive ? dict.proxyFailed : dict.tryAgain;
          if (normalized === "site_unreachable" || normalized === "load_failed" || normalized.includes("did not respond") || normalized.includes("did not open")) return dict.tryAgain;
          return dict.tryAgain;
        };
        const applyLocale = (localeValue) => {
          const locale = normalizeLocale(localeValue);
          const dict = copy[locale] || copy.en;
          const providerLabel = params.get("label") || params.get("provider") || dict.provider;
          const proxy = params.get("proxy") === "proxy" ? dict.proxyOn : dict.direct;
          const regionUnavailable = String(params.get("reason") || "").trim().toLowerCase() === "region_unavailable";
          document.documentElement.lang = locale;
          document.title = dict.title;
          document.getElementById("provider-label").textContent = providerLabel;
          document.getElementById("headline-tail").textContent = regionUnavailable ? dict.regionTail : dict.tail;
          document.getElementById("body-copy").textContent = regionUnavailable ? dict.regionBody : dict.body;
          document.getElementById("proxy-chip").textContent = proxy;
          document.getElementById("reason-chip").textContent = friendlyReason(dict);
          document.getElementById("connection-details").setAttribute("aria-label", dict.details);
        };
        applyLocale(params.get("lang") || "en");
        fetch("/api/v1/preferences", { cache: "no-store" })
          .then((response) => response.ok ? response.json() : null)
          .then((preferences) => {
            if (preferences && preferences.locale) applyLocale(preferences.locale);
            document.documentElement.dataset.fontTheme = normalizeFontTheme(preferences?.fontTheme);
          })
          .catch(() => undefined);

        const block = (event) => event.preventDefault();
        document.addEventListener("contextmenu", block, true);
        document.addEventListener("dragstart", block, true);
        document.addEventListener("selectstart", block, true);
        document.addEventListener("keydown", (event) => {
          const key = String(event.key || "").toLowerCase();
          if ((event.ctrlKey || event.metaKey) && ["+", "-", "=", "0", "r"].includes(key)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
  </body>
</html>
