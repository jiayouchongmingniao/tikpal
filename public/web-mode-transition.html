<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tikpal Explore</title>
    <style>
      :root {
        color-scheme: dark;
        background: #05070b;
        color: #f7fbff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --provider-tone: #81d7ff;
      }

      * {
        box-sizing: border-box;
        -webkit-user-drag: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        user-select: none;
        -webkit-touch-callout: none;
      }

      body {
        display: grid;
        place-items: center;
        background: #05070b;
      }

      .logo-floor {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
      }

      .logo-floor img {
        width: min(680px, 54vw);
        height: auto;
        opacity: 0.18;
        filter: grayscale(1) brightness(1.65) drop-shadow(0 26px 68px rgba(0, 0, 0, 0.42));
        transform: translateY(-2px);
      }

      .signal-stage {
        position: relative;
        z-index: 1;
        width: min(520px, calc(100vw - 96px));
        display: grid;
        justify-items: center;
        gap: 13px;
        transform: translateY(-4px);
        animation: tikpalSignalStageIn 260ms ease-out both;
      }

      .provider-name {
        margin: 0;
        color: #f7fbff;
        font-size: 30px;
        font-weight: 760;
        line-height: 1.1;
        text-align: center;
      }

      .connecting-label {
        margin: 0;
        color: color-mix(in srgb, var(--provider-tone) 72%, #ffffff);
        font-size: 12px;
        font-weight: 760;
        line-height: 1;
        text-transform: uppercase;
      }

      .signal-track {
        position: relative;
        width: min(420px, calc(100vw - 160px));
        height: 2px;
        margin-top: 8px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }

      .signal-track::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--provider-tone);
        opacity: 0.82;
        transform: scaleX(0.12);
        transform-origin: center;
        animation: tikpalSignalExpand 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
      }

      @keyframes tikpalSignalStageIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(-4px); }
      }

      @keyframes tikpalSignalExpand {
        from { opacity: 0.34; transform: scaleX(0.12); }
        to { opacity: 0.92; transform: scaleX(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .signal-stage,
        .signal-track::after {
          animation: none;
        }

        .signal-track::after {
          opacity: 0.82;
          transform: scaleX(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="logo-floor" aria-hidden="true">
      <img src="/assets/tikpal-scene-logo.png" alt="" />
    </div>
    <main class="signal-stage" role="status" aria-live="polite" aria-label="Connecting to Explore provider">
      <h1 class="provider-name">Explore</h1>
      <p class="connecting-label">Connecting</p>
      <div class="signal-track" aria-hidden="true"></div>
    </main>
    <script>
      (() => {
        const providers = {
          suno: { label: "Suno", tone: "#ff7a59" },
          spotify: { label: "Spotify", tone: "#1ed760" },
          youtube_music: { label: "YouTube Music", tone: "#ff0033" },
          apple_music: { label: "Apple Music", tone: "#f5f5f7" },
          tidal: { label: "TIDAL", tone: "#ffffff" },
          qobuz: { label: "Qobuz", tone: "#c7a45d" },
          deezer: { label: "Deezer", tone: "#b77cff" },
          amazon_music: { label: "Amazon Music", tone: "#46c4ff" },
          qq_music: { label: "QQ Music", tone: "#20d070" },
          netease_music: { label: "NetEase Cloud Music", tone: "#e64040" }
        };
        const providerId = new URLSearchParams(window.location.search).get("provider") || "";
        const provider = providers[providerId] || { label: "Explore", tone: "#81d7ff" };
        document.body.dataset.provider = providerId || "explore";
        document.documentElement.style.setProperty("--provider-tone", provider.tone);
        document.querySelector(".provider-name").textContent = provider.label;
        document.querySelector(".signal-stage").setAttribute("aria-label", `Connecting to ${provider.label}`);

        const block = (event) => event.preventDefault();
        document.addEventListener("contextmenu", block, true);
        document.addEventListener("dragstart", block, true);
        document.addEventListener("selectstart", block, true);
      })();
    </script>
  </body>
</html>
