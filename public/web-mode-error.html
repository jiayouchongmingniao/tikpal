<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tikpal Explore</title>
    <style>
      :root {
        color-scheme: dark;
        background: #05070c;
        color: #f7fbff;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
        -webkit-user-drag: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        -webkit-touch-callout: none;
      }

      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 22% 28%, rgba(42, 145, 255, 0.24), transparent 34%),
          radial-gradient(circle at 72% 70%, rgba(77, 255, 205, 0.13), transparent 32%),
          linear-gradient(135deg, #05070c 0%, #101733 55%, #070910 100%);
        user-select: none;
      }

      .shell {
        width: min(960px, 72vw);
        padding: 54px 62px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        background: rgba(5, 8, 16, 0.72);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.34);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: rgba(174, 218, 255, 0.76);
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 780px;
        color: #ffffff;
        font-size: 58px;
        line-height: 1.02;
        letter-spacing: 0;
      }

      p {
        max-width: 720px;
        margin: 24px 0 0;
        color: rgba(232, 242, 255, 0.76);
        font-size: 24px;
        line-height: 1.45;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(250, 253, 255, 0.9);
        font-size: 18px;
        font-weight: 800;
      }

      @media (max-width: 900px) {
        .shell {
          width: min(560px, calc(100vw - 44px));
          padding: 36px;
          border-radius: 22px;
        }

        h1 {
          font-size: 38px;
        }

        p {
          font-size: 19px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell" aria-live="polite">
      <p class="eyebrow">Explore</p>
      <h1><span id="provider-label">This music service</span> <span id="headline-tail">did not respond</span></h1>
      <p>
        <span id="body-copy">The official web player could not be reached from this device. Use the Proxy switch on the right, choose another provider, or try again later.</span>
      </p>
      <div class="chips" id="connection-details" aria-label="Connection details">
        <span class="chip" id="proxy-chip">Direct</span>
        <span class="chip" id="reason-chip">load_failed</span>
      </div>
    </main>
    <script>
      (() => {
        const copy = {
          en: {
            title: "Tikpal Explore",
            provider: "This music service",
            tail: "did not respond",
            body: "The official web player could not be reached from this device. Use the Proxy switch on the right, choose another provider, or try again later.",
            proxyOn: "Proxy On",
            direct: "Direct",
            details: "Connection details"
          },
          "zh-CN": {
            title: "Tikpal Explore",
            provider: "这个音乐服务",
            tail: "暂时没有响应",
            body: "此设备暂时无法打开官方网页播放器。请在右侧切换代理、选择其他服务，或稍后重试。",
            proxyOn: "代理已开",
            direct: "直连",
            details: "连接状态"
          },
          de: {
            title: "Tikpal Explore",
            provider: "Dieser Musikdienst",
            tail: "antwortet nicht",
            body: "Der offizielle Webplayer ist auf diesem Gerät nicht erreichbar. Schalte rechts den Proxy um, wähle einen anderen Dienst oder versuche es später erneut.",
            proxyOn: "Proxy Ein",
            direct: "Direkt",
            details: "Verbindungsdetails"
          },
          it: {
            title: "Tikpal Explore",
            provider: "Questo servizio musicale",
            tail: "non risponde",
            body: "Il player web ufficiale non è raggiungibile da questo dispositivo. Cambia Proxy a destra, scegli un altro servizio o riprova più tardi.",
            proxyOn: "Proxy On",
            direct: "Diretto",
            details: "Dettagli connessione"
          },
          ko: {
            title: "Tikpal Explore",
            provider: "이 음악 서비스",
            tail: "응답하지 않음",
            body: "이 기기에서 공식 웹 플레이어에 연결할 수 없습니다. 오른쪽에서 프록시를 바꾸거나 다른 서비스를 선택한 뒤 다시 시도하세요.",
            proxyOn: "프록시 켜짐",
            direct: "직접",
            details: "연결 정보"
          },
          ja: {
            title: "Tikpal Explore",
            provider: "この音楽サービス",
            tail: "が応答しません",
            body: "このデバイスから公式 Web プレイヤーに接続できません。右側でプロキシを切り替えるか、別のサービスを選んでください。",
            proxyOn: "プロキシ オン",
            direct: "直接",
            details: "接続情報"
          },
          es: {
            title: "Tikpal Explore",
            provider: "Este servicio de música",
            tail: "no responde",
            body: "No se pudo abrir el reproductor web oficial desde este dispositivo. Cambia Proxy a la derecha, elige otro servicio o inténtalo más tarde.",
            proxyOn: "Proxy On",
            direct: "Directo",
            details: "Detalles de conexión"
          }
        };
        const params = new URLSearchParams(location.search);
        const normalizeLocale = (value) => Object.prototype.hasOwnProperty.call(copy, value || "") ? value : "en";
        const applyLocale = (localeValue) => {
          const locale = normalizeLocale(localeValue);
          const dict = copy[locale] || copy.en;
          const providerLabel = params.get("label") || params.get("provider") || dict.provider;
          const proxy = params.get("proxy") === "proxy" ? dict.proxyOn : dict.direct;
          document.documentElement.lang = locale;
          document.title = dict.title;
          document.getElementById("provider-label").textContent = providerLabel;
          document.getElementById("headline-tail").textContent = dict.tail;
          document.getElementById("body-copy").textContent = dict.body;
          document.getElementById("proxy-chip").textContent = proxy;
          document.getElementById("connection-details").setAttribute("aria-label", dict.details);
        };
        const reason = params.get("reason") || "load_failed";
        document.getElementById("reason-chip").textContent = reason;
        applyLocale(params.get("lang") || "en");
        fetch("/api/v1/preferences", { cache: "no-store" })
          .then((response) => response.ok ? response.json() : null)
          .then((preferences) => {
            if (preferences && preferences.locale) applyLocale(preferences.locale);
          })
          .catch(() => undefined);

        const block = (event) => event.preventDefault();
        document.addEventListener("contextmenu", block, true);
        document.addEventListener("dragstart", block, true);
        document.addEventListener("selectstart", block, true);
        document.addEventListener("keydown", (event) => {
          const key = String(event.key || "").toLowerCase();
          if ((event.ctrlKey || event.metaKey) && ["+", "-", "=", "0", "r"].includes(key)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
  </body>
</html>
