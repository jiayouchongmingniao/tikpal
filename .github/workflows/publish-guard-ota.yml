name: Publish Provider Guard OTA

on:
  push:
    tags:
      - "guard-v*"

permissions:
  contents: read

concurrency:
  group: provider-guard-ota-stable
  cancel-in-progress: false

jobs:
  publish:
    name: Sign and publish stable Provider Guard
    runs-on: ubuntu-latest
    env:
      GUARD_R2_BUCKET: tikpal-guard-releases
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_GUARD_RELEASES_TOKEN }}
      TIKPAL_GUARD_OTA_ED25519_PRIVATE_KEY: ${{ secrets.TIKPAL_GUARD_OTA_ED25519_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ota:guard
      - run: npm run test:kiosk
      - run: npm run build

      - name: Validate release tag and signing material
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#guard-v}"
          [[ "$GITHUB_REF_NAME" == "guard-v$version" && "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ -n "$TIKPAL_GUARD_OTA_ED25519_PRIVATE_KEY" ]]
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]
          node --input-type=module - "$version" <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          const version = process.argv[2];
          const manifest = JSON.parse(await readFile("deploy/chromium/web-mode-extension/manifest.json", "utf8"));
          const expected = String(await readFile("deploy/chromium/guard-ota-extension-key.sha256", "utf8")).trim();
          const actual = createHash("sha256").update(String(manifest.key ?? "")).digest("hex");
          if (manifest.version !== version || !/^[a-f0-9]{64}$/.test(expected) || actual !== expected) {
            throw new Error("Guard tag, extension version, or pinned extension identity does not match");
          }
          NODE

      - name: Build signed release files
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#guard-v}"
          key_file="$RUNNER_TEMP/tikpal-guard-ota-private.pem"
          output_dir="$RUNNER_TEMP/tikpal-guard-ota"
          umask 077
          printf '%s\n' "$TIKPAL_GUARD_OTA_ED25519_PRIVATE_KEY" > "$key_file"
          node scripts/build-guard-ota-release.mjs --version "$version" --out "$output_dir" --private-key-file "$key_file"
          rm -f "$key_file"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/existing-release.json"
          if npx --yes wrangler@4 r2 object get "$GUARD_R2_BUCKET/guard/v1/releases/${{ steps.package.outputs.version }}/release.json" --file "$probe" --remote; then
            echo "Guard OTA release ${{ steps.package.outputs.version }} already exists in R2" >&2
            exit 1
          fi

      - name: Upload immutable release before channel pointer
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${{ steps.package.outputs.output_dir }}/guard/v1/releases/${{ steps.package.outputs.version }}"
          while IFS= read -r file; do
            relative="${file#$release_dir/}"
            content_type="application/octet-stream"
            case "$relative" in
              *.json) content_type="application/json" ;;
              *.mjs|*.js) content_type="application/javascript" ;;
              *.css) content_type="text/css" ;;
            esac
            npx --yes wrangler@4 r2 object put "$GUARD_R2_BUCKET/guard/v1/releases/${{ steps.package.outputs.version }}/$relative" --file "$file" --content-type "$content_type" --cache-control "public, max-age=31536000, immutable" --remote
          done < <(find "$release_dir" -type f -print | sort)

      - name: Publish signed stable channel pointer last
        shell: bash
        run: |
          set -euo pipefail
          channel_dir="${{ steps.package.outputs.output_dir }}/guard/v1/channels"
          npx --yes wrangler@4 r2 object put "$GUARD_R2_BUCKET/guard/v1/channels/stable.json" --file "$channel_dir/stable.json" --content-type application/json --cache-control no-store --remote
          npx --yes wrangler@4 r2 object put "$GUARD_R2_BUCKET/guard/v1/channels/stable.json.sig" --file "$channel_dir/stable.json.sig" --content-type text/plain --cache-control no-store --remote
