# Tikpal kiosk Chromium flags.
# Blank lines and comments are ignored by launch-tikpal-kiosk.sh.
--no-first-run
--no-default-browser-check
--disable-session-crashed-bubble
--disable-infobars
--disable-features=Translate,InterestFeedContentSuggestions,MediaRouter,OptimizationHints
--autoplay-policy=no-user-gesture-required
--overscroll-history-navigation=0
--disable-pinch
--hide-scrollbars
--enable-webgl
--enable-accelerated-2d-canvas
--ignore-gpu-blocklist
--password-store=basic
--use-mock-keychain
